<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color-Changer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        font-size: 16px;
      }

      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        background: oklch(0.704 0.04 256.788);
        height: 100vh;
        color: #000;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      .canvas {
        height: 100%;
        width: 100%;
      }

      .color-btn {
        display: flex;
        gap: 30px;
        border: #000 1px solid;
        padding: 20px;
      }

      .color-btn button {
        padding: 1.05rem;
        border-radius: 15px;
        border: 1px solid;
      }

      input {
        background: none;
        border: none;
        appearance: none;
        height: 60px;
        width: 80px;
        border-radius: 35%;
        border: #000;
        align-content: center;
      }
    </style>
  </head>
  <body>
    <div class="canvas"></div>
    <span class="color-btn">
      <button id="color" style="background-color: #ff0000">Red</button>
      <button id="color" style="background-color: #00ff00">Green</button>
      <button id="color" style="background-color: #0000ff">Blue</button>
      <button id="color" style="background-color: #ffff00">Yellow</button>
      <input type="color" id="color" />
    </span>
    <script src="index.js"></script>
  </body>
</html>
